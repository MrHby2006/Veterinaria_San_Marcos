spring.application.name=ventas

spring.datasource.url=jdbc:mysql://localhost:3306/ventas

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8085

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migracion

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Se registra como localhost, asi el gateway lo encuentra en cualquier PC o red
eureka.instance.hostname=localhost

# Muestra el mensaje de error (ej: "Ya existe una cuenta con ese correo") en la respuesta
spring.web.error.include-message=always

# Si llega un numero con decimales donde va un entero (ej: 1500.7) se rechaza en vez de cortarlo a 1500
spring.jackson.deserialization.accept-float-as-int=false
